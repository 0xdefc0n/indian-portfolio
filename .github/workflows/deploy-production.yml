name: Deploy production

# Manual only (plan §15.3). Add required reviewers to the "production" environment in the repo settings so a run
# waits for the owner's approval. Fails until M17 creates the production resources (wrangler.jsonc env.production).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pocketfolio.in
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: worker/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: npm ci
        working-directory: worker
      - run: npx wrangler d1 migrations apply DB --remote --env production
        working-directory: worker
      - run: npx wrangler d1 migrations apply MARKET --remote --env production
        working-directory: worker
      - run: npx wrangler deploy --env production
        working-directory: worker
      - name: Smoke test /api/health
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 60 https://pocketfolio.in/api/health) && echo "$body" | grep -q '"ok":true' && { echo "$body"; exit 0; }
            sleep 10
          done
          echo "production /api/health did not come up"; exit 1
