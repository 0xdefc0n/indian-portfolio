name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PRs cancel superseded runs; pushes to main never do, so a staging deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  engine:
    name: Engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - run: uv sync --frozen
      # private real-PDF tests skip themselves: CI never has statements
      - run: uv run pytest -q -p no:warnings

  engine-image:
    name: Engine (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pocketfolio-engine:ci engine

  worker:
    name: Worker (vitest + typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: worker/.nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # wrangler.jsonc serves ../web/dist; the tests only need the folder to exist.
      - run: mkdir -p ../web/dist
      # Vitest builds the engine image with Docker (preinstalled on ubuntu-latest) for the container test.
      - run: npm test

  # Merge to main → migrate both staging D1s, deploy the Worker + engine image, then check /api/health (plan §15.3).
  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, engine, engine-image, worker]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.pocketfolio.in
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: worker/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: npm ci
        working-directory: worker
      - run: npx wrangler d1 migrations apply DB --remote --env staging
        working-directory: worker
      - run: npx wrangler d1 migrations apply MARKET --remote --env staging
        working-directory: worker
      # Builds the engine image with the runner's Docker and pushes it to the Cloudflare registry.
      - run: npx wrangler deploy --env staging
        working-directory: worker
      # A cold container start can take a while after a new image rolls out: retry for up to ~5 min.
      - name: Smoke test /api/health
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 60 https://staging.pocketfolio.in/api/health) && echo "$body" | grep -q '"ok":true' && { echo "$body"; exit 0; }
            sleep 10
          done
          echo "staging /api/health did not come up"; exit 1
