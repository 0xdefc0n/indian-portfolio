name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  engine:
    name: Engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - run: uv sync --frozen
      # private real-PDF tests skip themselves: CI never has statements
      - run: uv run pytest -q -p no:warnings

  engine-image:
    name: Engine (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pocketfolio-engine:ci engine

  worker:
    name: Worker (vitest + typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: worker/.nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # wrangler.jsonc serves ../web/dist; the tests only need the folder to exist.
      - run: mkdir -p ../web/dist
      # Vitest builds the engine image with Docker (preinstalled on ubuntu-latest) for the container test.
      - run: npm test

  # Staging deploy on merge to main is added in M4.
